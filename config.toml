# Prompter 自动化配置
[app]
name = "prompter"
version = "1.0.0"
auto_upload_enabled = true
upload_interval_hours = 1

[filter]
# 中文检测设置
detect_chinese = true
min_chinese_chars = 3
exclude_commands = ["/", "quit", "exit", "help"]

[cloudflare]
# Cloudflare 配置 (需要填写)
account_id = ""  # 你的 Cloudflare Account ID
zone_id = ""     # 你的域名 Zone ID
api_token = ""   # API Token (需要 Zone:Edit 权限)

[website]
# 网站配置
domain = ""      # 你的域名，如: example.com
upload_endpoint = "/api/prompts"  # 上传接口路径
github_repo = "" # GitHub 仓库，如: username/repo-name

[storage]
# 本地存储配置
data_dir = "./data"
prompts_file = "prompts.md"
backup_dir = "./backups"
max_backups = 10

[logging]
level = "info"
file = "prompter.log"
max_size_mb = 50

# AI反馈系统配置
[ai_feedback]
enabled = false                    # 系统启用状态
gemini_api_key = "YOUR_NEW_API_KEY_HERE"                # Gemini API密钥 (请替换为新的 key)
telegram_bot_token = "8120640865:AAEbb9OpJ2LbH6jktChbbnu11KuIB-XdD6o"            # Telegram Bot Token
telegram_chat_id = ""              # Chat ID
daily_report_time = "09:00"        # 每日推送时间
max_prompts_per_analysis = 50      # 单次分析最大提示词数量

# Gemini模型配置
thinking_model = "gemini-2.0-flash-thinking-exp-01-21"    # 思考模型（更智能但可能有配额限制）
fast_model = "gemini-2.5-flash"                           # 快速模型（作为降级备选）
thinking_budget = 1024                                     # 思考预算（-1=动态，0=关闭，>0=固定预算）
auto_fallback = true                                       # 当思考模型配额不足时自动切换到快速模型
max_retries = 3                                            # 最大重试次数