# Prompter 自动化配置
[app]
name = "prompter"
version = "1.0.0"
auto_upload_enabled = true
upload_interval_hours = 1

[filter]
# 中文检测设置
detect_chinese = true
min_chinese_chars = 3
exclude_commands = ["/", "quit", "exit", "help"]

[cloudflare]
# Cloudflare 配置 (需要填写)
account_id = ""  # 你的 Cloudflare Account ID
zone_id = ""     # 你的域名 Zone ID
api_token = ""   # API Token (需要 Zone:Edit 权限)

[website]
# 网站配置
domain = ""      # 你的域名，如: example.com
upload_endpoint = "/api/prompts"  # 上传接口路径
github_repo = "" # GitHub 仓库，如: username/repo-name

[storage]
# 本地存储配置
data_dir = "./data"
prompts_file = "prompts.md"
backup_dir = "./backups"
max_backups = 10

[logging]
level = "info"
file = "prompter.log"
max_size_mb = 50

# AI反馈系统配置
[ai_feedback]
enabled = true                    # 系统启用状态
llm_provider = "perplexity"
llm_mode = "fast"

# Gemini API配置
gemini_api_key = "AIzaSyB0UzfaoPHNtK8f3UcllFxEJYeggls_5I8"
fast_model = "gemini-2.5-flash"                           # 快速模型（仅使用快速模型）

# Perplexity API配置
perplexity_api_key = "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"
perplexity_model = "sonar-reasoning"                      # Perplexity模型: "sonar" 或 "sonar-reasoning"
perplexity_api_url = "https://api.perplexity.ai"         # Perplexity API地址

# Telegram配置
telegram_bot_token = "8120640865:AAEbb9OpJ2LbH6jktChbbnu11KuIB-XdD6o"            # Telegram Bot Token
telegram_chat_id = "8200837007"              # Chat ID
daily_report_time = "09:00"        # 每日推送时间
max_prompts_per_analysis = 50      # 单次分析最大提示词数量
max_retries = 3                                            # 最大重试次数

# 新系统提示词 - LLM提示词审阅分析员
system_prompt = """你是一名专业的 LLM 提示词审阅分析员。请基于今天抓取到的所有"我与 Claude Code 的提示词交互记录"，输出一份可在 1 分钟内阅读完毕的日报式总结。按照以下要求生成内容：

1. **关键不足与改进建议（最重要）**
   * 用简洁、结构化的方式指出用户提示词在表达、目标定义、约束条件、输入结构、示例、可执行性、可复用性等方面的不足。
   * 每条给出明确、可操作的改写建议。
   * 参考 OpenAI/Anthropic 官方文档与研究中的提示词最佳实践（如：清晰指令、层级化结构、角色设定、输入输出示例、约束条件、逐步推理等）。

2. **亮点与优秀交互案例**
   * 选出当天 1–3 个做得特别好的提示词或交互，并说明为何有效（与最佳实践的对齐点）。

3. **总体模式洞察**
   * 简要概括用户近期提示词风格的趋势：典型误区、优势、可优化方向。

4. **风格要求**
   * 简洁精炼、无废话；整体阅读时间不超过2分钟。
   * 按条列形式组织，不要冗长解释。
   * 聚焦任务性、结构化、可执行。
   * 不用markdown语法，直接输出即可。

输出格式如下（严格遵守）：

【不足与改进】
* …
* …

【亮点案例】
* …

【总体洞察】
* …"""
