[package]
name = "prompter"
version = "0.1.0"
edition = "2021"
description = "A lightweight local terminal app to monitor and save Claude Code CLI prompts"
authors = ["Your Name <your.email@example.com>"]

# 隐藏编译警告以获得更清洁的输出
[profile.dev]
warnings = "allow"

[profile.release]
warnings = "allow"

[lib]
name = "prompter"
path = "src/lib.rs"

[[bin]]
name = "prompter"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
portable-pty = "0.8"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
toml = "0.8"
uuid = { version = "1.0", features = ["v4"] }
tokio-cron-scheduler = "0.9"
unicode-segmentation = "1.10"
notify = "5.0"
base64 = "0.21"
url = "2.4"
webbrowser = "0.8"
dirs = "5.0"
psutil = { version = "3.3.0", default-features = false, features = ["process"] }