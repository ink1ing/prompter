version: '3.8'

services:
  prompter:
    build: .
    container_name: prompter
    volumes:
      - ./data:/data  # 持久化数据
      - /tmp/.X11-unix:/tmp/.X11-unix:ro  # X11 转发（如果需要GUI）
    environment:
      - OUTPUT_DIR=/data
      - DISPLAY=${DISPLAY}
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Web界面版本（可选）
  prompter-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: prompter-web
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - WEB_PORT=8080
    restart: unless-stopped